# Open Eleven sous Docker : la base, le serveur du jeu, et Caddy devant.
#
#   cp .env.example .env     puis renseigner .env
#   docker compose up -d --build
#
# Seul Caddy est joignable de l'extérieur ; la base et le serveur ne sont
# visibles que des autres conteneurs.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: openeleven
      POSTGRES_USER: openeleven
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Renseignez POSTGRES_PASSWORD dans .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openeleven -d openeleven"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      target: server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://openeleven:${POSTGRES_PASSWORD}@db:5432/openeleven
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Open Eleven <no-reply@localhost>}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 10s

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
