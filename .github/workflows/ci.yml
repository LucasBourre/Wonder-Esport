# Intégration continue : à chaque envoi sur main et à chaque demande de fusion, tout est rejoué.
#
#   verification  types, tests unitaires, audit de traduction, assemblage
#   serveur       le serveur contre une vraie base Postgres et un faux serveur d'e-mails
#   deploiement   sur main seulement, une fois les deux autres au vert : met le serveur
#                 à jour par SSH en lançant deploy/deploy.sh
#
# Les parcours navigateur (npm run test:e2e) ne tournent qu'en local.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Tests (moteur, contenu, traduction)
        run: npm test
      - name: Assemblage
        run: npm run build

  serveur:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openeleven
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d openeleven"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @open-eleven/server
      - name: Tests du serveur
        run: npm run test:server
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/openeleven
          MAILPIT_URL: http://localhost:8025
          SMTP_URL: smtp://localhost:1025

  deploiement:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verification, serveur]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploiement
      cancel-in-progress: false
    steps:
      - name: Se connecter au serveur et le mettre à jour
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Clé du serveur (ssh-ed25519 AAAA…) : on ne garde que le type et la clé, et la ligne
          # known_hosts est composée ici avec le même hôte et le même port que la connexion.
          cle="$(printf '%s' "$DEPLOY_HOST_KEY" | tr -d '\r' | awk 'NR==1 { print $1 " " $2 }')"
          if [ "${DEPLOY_PORT:-22}" = 22 ]; then hote="$DEPLOY_HOST"; else hote="[$DEPLOY_HOST]:$DEPLOY_PORT"; fi
          printf '%s %s\n' "$hote" "$cle" > ~/.ssh/known_hosts
          # La clé n'autorise qu'un seul programme côté serveur (deploy/deploy.sh) :
          # la commande donnée ici est ignorée.
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" deploy
