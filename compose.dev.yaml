# Développement : seulement la base, joignable sur localhost:5432. Le serveur
# et l'interface tournent hors Docker (npm run dev), pour le rechargement à chaud.
#
#   docker compose -f compose.dev.yaml up -d
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: openeleven
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dev-db-data:/var/lib/postgresql/data

volumes:
  dev-db-data:
